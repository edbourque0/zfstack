name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/zfstack

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: ref
        run: echo "image=${IMAGE_NAME}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        id: cfg
        env:
          ARCANE_API_KEY: ${{ secrets.ARCANE_API_KEY }}
        run: |
          if [ -z "$ARCANE_API_KEY" ] || [ -z "${{ vars.ARCANE_PROJECT_ID }}" ]; then
            echo "::warning::Skipping deploy: set the ARCANE_API_KEY secret and the ARCANE_PROJECT_ID variable."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Deploy to Arcane
        if: steps.cfg.outputs.ready == 'true'
        env:
          ARCANE_URL: ${{ vars.ARCANE_URL }}
          ARCANE_ENV_ID: ${{ vars.ARCANE_ENV_ID }}
          ARCANE_PROJECT_ID: ${{ vars.ARCANE_PROJECT_ID }}
          ARCANE_API_KEY: ${{ secrets.ARCANE_API_KEY }}
          IMAGE: ${{ needs.build.outputs.image }}
          HEALTH_URL: ${{ vars.ZFSTACK_HEALTH_URL }}
          # A long-lived read:packages token keeps Arcane able to pull later;
          # without it the job's short-lived token is used for this deploy only.
          REGISTRY_USER: ${{ secrets.GHCR_PULL_TOKEN && github.repository_owner || github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
        run: node .github/scripts/arcane-deploy.mjs
